<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>花粉管観察ナビ</title>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sticky header with three views (工程 / 試薬 / 記録). 工程 view = lot strip on top, one-step-at-a-time card below.
   工程8 = 花柱ごとの記録（処理区 → 花 → 花柱）。方法（軟化液・透明化・すすぎ・封入液）はロットごとに選ぶ。 */
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --sunk:#E8EEF5; --ink:#15233A; --muted:#566880; --line:#D3DCE7;
  --accent:#1D5FA8; --accent-ink:#FFFFFF; --glow:#0A93B3; --glow-soft:#DDF3F8;
  --warn:#9A6312; --warn-soft:#FBF0DC; --ok:#2C7A4F; --ok-soft:#E1F3E8; --danger:#B33A3A;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1119; --surface:#131C28; --sunk:#0F1722; --ink:#E2EAF4; --muted:#8C9DB3; --line:#253447;
  --accent:#6AAEEA; --accent-ink:#0B1119; --glow:#4FD3EE; --glow-soft:#123341;
  --warn:#E3AA4E; --warn-soft:#2E2414; --ok:#62C792; --ok-soft:#14301F; --danger:#F07A7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1119; --surface:#131C28; --sunk:#0F1722; --ink:#E2EAF4; --muted:#8C9DB3; --line:#253447;
  --accent:#6AAEEA; --accent-ink:#0B1119; --glow:#4FD3EE; --glow-soft:#123341;
  --warn:#E3AA4E; --warn-soft:#2E2414; --ok:#62C792; --ok-soft:#14301F; --danger:#F07A7A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:auto;min-width:0}
.brand b{font-size:17px;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:11.5px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.save-state{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save-state i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.save-state.local i{background:var(--warn)}

main{padding-block:18px 60px}
h2{font-size:18px;margin:0 0 10px;text-wrap:balance}
.lede{color:var(--muted);font-size:13.5px;margin:0 0 14px;max-width:62ch}

/* lot strip */
.lots{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.lot{flex:0 0 auto;width:182px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.lot[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.lot .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lot .pill{white-space:normal}
.dots{display:flex;gap:3px}
.dots span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots span.d{background:var(--accent)}
.dots span.c{background:var(--glow)}
.lot .st{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.lot .st .mono{color:var(--glow);font-weight:600}
.lot.new{align-items:center;justify-content:center;border-style:dashed;color:var(--accent);font-weight:700;width:130px;text-align:center}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.A{background:var(--sunk);color:var(--muted)}
.pill.N{background:var(--ok-soft);color:var(--ok)}
.pill.cs{background:var(--glow-soft);color:var(--glow)}
.pill.alpha{background:var(--warn-soft);color:var(--warn)}
.pill.okp{background:var(--ok-soft);color:var(--ok)}

/* lot header */
.lothead{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.lothead .t{flex:1;min-width:0}
.lothead b{font-size:16px;margin-right:6px}
.lothead .stamp{margin-top:2px}

/* step card */
.rail{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-bottom:12px}
.rail button{border:0;background:var(--sunk);border-radius:6px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);min-width:0}
.rail button b{font-family:var(--f-mono);font-size:14px}
.rail button small{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rail button.done{background:var(--accent);color:var(--accent-ink)}
.rail button.cur{background:var(--glow);color:var(--accent-ink)}
.rail button.view{outline:2px solid var(--ink);outline-offset:1px}
@media (max-width:560px){.rail button small{display:none}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-h{display:flex;gap:16px;align-items:flex-start;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.num{font-family:var(--f-mono);font-size:40px;font-weight:600;line-height:1;color:var(--accent);min-width:1.4ch}
.card-h .t{min-width:0;flex:1}
.card-h h3{margin:0;font-size:20px;line-height:1.35;text-wrap:balance}
.cond{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cond span{font-size:12.5px;background:var(--sunk);border-radius:6px;padding:1px 8px;color:var(--muted)}
.cond span.chg{background:var(--glow-soft);color:var(--glow);font-weight:700}
.card-b{padding:16px 20px;display:grid;gap:12px}
.card-b p{margin:0;max-width:64ch}
.note{border-radius:8px;padding:9px 12px;font-size:13.5px;background:var(--warn-soft);color:var(--ink)}
.note b{color:var(--warn)}
.note.info{background:var(--sunk)}
.note.info b{color:var(--muted)}
.note.waste{background:var(--ok-soft)}
.note.waste b{color:var(--ok)}
.chip{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:0 9px;font-size:13.5px;font-weight:700;line-height:1.6;margin:0 2px}
.chip:hover{background:var(--accent);color:var(--accent-ink)}

.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--sunk);border-radius:10px;padding:12px 14px}
.timer .big{font-family:var(--f-mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--glow);letter-spacing:.02em}
.timer.over .big{color:var(--ok)}
.timer .meta{font-size:12.5px;color:var(--muted);line-height:1.5}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1 1 160px;min-width:120px}
.bar i{display:block;height:100%;background:var(--glow);width:0}
.timer.over .bar i{background:var(--ok)}

.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 20px 18px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;font-weight:700;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.glow{background:var(--glow);border-color:var(--glow);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);font-weight:400;padding-inline:8px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.sp{flex:1}
.stamp{font-size:12.5px;color:var(--muted)}
.stamp .mono{color:var(--ink)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.fld .lab{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.fld select:disabled{opacity:.5}
.fld textarea{min-height:64px;resize:vertical}
.fld.wide{grid-column:1/-1}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
.fld.chk input{width:auto}
.fld.chk label{font-size:13.5px;color:var(--ink);font-weight:400}
.mbox{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;background:var(--bg)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px 22px;display:grid;gap:12px;justify-items:start}
.empty h3{margin:0;font-size:18px}
.empty p{margin:0;color:var(--muted);max-width:60ch}

/* 花柱ごとの記録（工程8） */
.obs{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.obs-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.obs-h b{font-size:16px}
.pick-l{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:baseline;max-width:100%;text-align:left}
.pick button small{font-family:var(--f-mono);font-size:11px;opacity:.8}
.pick button.full{background:var(--ok-soft);border-color:transparent}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.sty{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.sty.lost{background:var(--sunk)}
.sty-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.sty-h label{font-size:13px;display:flex;align-items:center;gap:5px;color:var(--muted)}
.sty-h .wr{font-size:12.5px;color:var(--warn);font-weight:700}
.sty-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 10px}
.lines{display:flex;flex-wrap:wrap;gap:6px}
.lines label{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.fld .lines input{width:54px;text-align:center;padding:6px 4px}

/* reagents */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:22px}
.rcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rcard b{font-size:15px}
.rcard small{color:var(--muted);font-size:12.5px}
.rcard:hover{border-color:var(--accent)}
.est{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:12px;margin-bottom:22px}
.est-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.est-out div{background:var(--sunk);border-radius:8px;padding:8px 12px}
.est-out small{display:block;font-size:12px;color:var(--muted)}
.est-out b{font-family:var(--f-mono);font-size:20px}
.sec{margin-bottom:22px}
.sec td{white-space:normal}
.sec td:first-child{font-weight:700}

/* records */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--sunk);font-size:12px;color:var(--muted);position:sticky;top:0}
td.mono{font-size:12.5px}
.rec-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}

/* modal */
.scrim{position:fixed;inset:0;background:rgb(5 10 18 / .5);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.sheet{background:var(--surface);width:min(640px,100%);max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.sheet-h h3{margin:0;font-size:19px;flex:1}
.sheet-h small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.sheet p{margin:0 0 10px}
.vol{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 12px}
.vol input{width:110px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);font-family:var(--f-mono);font-size:16px}
.vol .pre{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:3px 11px;font-size:13px;font-family:var(--f-mono)}
.ing{width:100%;margin-bottom:12px}
.ing td{white-space:normal}
.ing td:last-child{text-align:right;font-family:var(--f-mono);font-size:16px;font-weight:600;color:var(--accent);white-space:nowrap}
.sheet ol{margin:0 0 12px;padding-left:1.4em}
.sheet ol li{margin-bottom:3px}
.sheet .note{margin-bottom:6px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:6px;padding:3px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent)}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mv{display:flex;gap:8px;align-items:baseline;padding:6px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mv b{font-family:var(--f-mono);min-width:1.6em}
.mv .stamp{margin-left:auto}
.ck{display:flex;gap:8px;align-items:baseline;margin-top:8px;font-size:13.5px}
.trow{display:grid;grid-template-columns:2em minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.2fr) 2.2em;gap:6px;align-items:center;margin-bottom:6px}
.trow input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
.trow.th{font-size:12px;color:var(--muted);font-weight:700;margin-top:12px}
.trow .btn{padding:4px 0}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13.5px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head><body>

<header class="top"><div class="wrap">
  <div class="brand"><b>花粉管観察ナビ</b><small>ニホンナシ｜押しつぶし法 Ver. 2.1｜方法はロットごとに選択｜花柱ごとの記録</small></div>
  <nav class="tabs" role="tablist" aria-label="表示切替">
    <button id="tab-run" role="tab" aria-selected="true" data-v="run">工程</button>
    <button id="tab-reag" role="tab" aria-selected="false" data-v="reag">試薬</button>
    <button id="tab-rec" role="tab" aria-selected="false" data-v="rec">記録</button>
  </nav>
  <div class="save-state" id="saveState"><i></i><span>接続中…</span></div>
</div></header>

<main class="wrap">
  <section id="v-run"></section>
  <section id="v-reag" hidden></section>
  <section id="v-rec" hidden></section>
</main>
<div id="modal" class="scrim" hidden></div>
<div id="toast" hidden></div>

<script>
(()=>{
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmt=ts=>{if(!ts)return"";const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const dur=ms=>{const neg=ms<0;ms=Math.abs(ms);const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;return (neg?"+":"")+(d?d+"日 ":"")+`${pad(h)}:${pad(m)}:${pad(x)}`};
const g=x=>x<1?x.toFixed(3):x<10?x.toFixed(2):x.toFixed(1);
const g2=x=>x.toFixed(2);            /* 0.01 g のはかりに合わせた表示 */
const ml=x=>x<10?x.toFixed(1):Math.round(x).toString();
let toastT;function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}
const chip=(k,l)=>`<button class="chip" data-r="${k}">${l}</button>`;
const SULF=0.0063;                   /* 亜硫酸Na 無水物 50 mM：液量(mL)×0.0063 g（03 の2節） */

/* ---------- waste / safety (03 の3・4節) ---------- */
const WASTE=[
  ["ClearSeeAlpha（亜硫酸なしのClearSeeも同じ）","有機","亜硫酸塩を含むので酸と混ぜない。有機廃液に酸（FAAなど）が多い場合は別容器か担当者に確認"],
  ["FAA","有機","ホルマリンを別回収している場合はそちら"],
  ["グリセリン封入液","有機","スライドに付いた分は固形廃棄物"],
  ["1N KOH（亜硫酸入りを含む）","無機・アルカリ性","亜硫酸入りは容器に「亜硫酸塩含有」と書く。酸性廃液に入れない"],
  ["アニリンブルー染色液、0.1M K₃PO₄","無機・アルカリ性","pH 12前後"]
];
const SAFETY=[
  ["KOH","強アルカリで70℃。手袋・保護メガネ。粉や袋は静かに入れる"],
  ["亜硫酸Na＋KOH","混ぜても危険はない（ガス・発熱なし）。温めたKOHに加えてよい"],

/* ---------- 方法（ロットごとに選ぶ。いつでも変えられる） ----------
   lot.soft ＝軟化液："kohs"＝1N KOH＋亜硫酸Na、"koh"＝1N KOHのみ
   lot.clr  ＝透明化："none"＝なし、"cs"＝ClearSee、"alpha"＝ClearSeeAlpha（日数は lot.days）
   lot.rinse＝工程5'のK₃PO₄すすぎ：1＝する、0＝しない（透明化なしのときは常にしない）
   lot.mount＝封入液："gly"＝グリセリン封入液、"ab"＝染色液
   これらの項目がないロット（2026-11-24 以前の形式）は、zone と reagent から決める：
   zone A＝従来法、N＝透明化なし、それ以外は reagent（cs／alpha）。zone は区の記号（ラベル）として残る。 */
const softOf=l=>l.soft==="koh"||l.soft==="kohs"?l.soft:(l.zone==="A"?"koh":"kohs");
const clrOf=l=>l.clr==="none"||l.clr==="cs"||l.clr==="alpha"?l.clr:(l.zone==="A"||l.zone==="N"?"none":(l.reagent==="cs"?"cs":"alpha"));
const rinseOf=l=>clrOf(l)==="none"?false:(l.rinse==null?clrOf(l)==="alpha":!!+l.rinse);
const mountOf=l=>l.mount==="ab"||l.mount==="gly"?l.mount:(l.zone==="A"?"ab":"gly");
const softKoh=l=>softOf(l)==="koh";
const mountAb=l=>mountOf(l)==="ab";
const noClear=l=>clrOf(l)==="none";
const isAlpha=l=>clrOf(l)==="alpha";
const rName=l=>isAlpha(l)?"ClearSeeAlpha":"ClearSee";
const PRESETS={
  conv:{name:"従来法",soft:"koh",clr:"none",rinse:0,mount:"ab",desc:"KOHのみ → 染色 → 染色液で封入"},
  noclr:{name:"透明化なし",soft:"kohs",clr:"none",rinse:0,mount:"gly",desc:"KOH＋亜硫酸Na → 染色 → グリセリン封入"},
  cs:{name:"ClearSee",soft:"kohs",clr:"cs",rinse:0,mount:"gly",desc:"KOH＋亜硫酸Na → ClearSee → 染色 → グリセリン封入"},
  alpha:{name:"ClearSeeAlpha",soft:"kohs",clr:"alpha",rinse:1,mount:"gly",desc:"KOH＋亜硫酸Na → ClearSeeAlpha → すすぎ → 染色 → グリセリン封入（基本）"}
};
const methOf=l=>({soft:softOf(l),clr:clrOf(l),rinse:rinseOf(l)?1:0,mount:mountOf(l)});
const presetKey=m=>Object.keys(PRESETS).find(k=>{const p=PRESETS[k];return p.soft===m.soft&&p.clr===m.clr&&p.rinse===m.rinse&&p.mount===m.mount})||"";
const methName=l=>{const k=presetKey(methOf(l));if(k)return PRESETS[k].name;return "組合せ"};
const methSummary=l=>{const m=methOf(l);
  return `${m.soft==="koh"?"KOHのみ":"KOH＋亜硫酸Na"} ${l.koh||10}分 → ${m.clr==="none"?"透明化なし":`${rName(l)} ${l.days||1}日 → ${m.rinse?"すすぎ":"すすぎなし"}`} → ${m.mount==="ab"?"染色液で封入":"グリセリン封入"}`};
const wasteNote=t=>`<div class="note waste"><b>廃液</b>　${t}</div>`;

/* ---------- 処理区・花・花柱（記録形式2、04 の5節） ----------
   lot.trts ＝ [{id,name,fa,fb}]（処理区。無ければ「処理区を分けない」＝旧形式のロットもこの扱い）
   lot.fpt  ＝ 1処理区あたりの花数（trts があるとき。無いときは lot.flowers が花数）
   lot.spf  ＝ 1花あたりの花柱数（初期値5）、lot.maxmm ＝ 2 mm線の上限（初期値20）
   lot.obs  ＝ {"処理区id-花-花柱": {l,t,e,c,n,x,at}}
     l＝雌しべの長さ（区分の下限mm。14 は 14–16 mm）、t＝最先端（"none"／区分の下限mm／"base"／"unk"）、
     e＝花柱に入った本数、c＝{線mm:越えた本数}、n＝備考、x＝欠測、at＝更新時刻 */
const MAXMM_DEF=20,SPF_DEF=5;
const hasTrts=l=>Array.isArray(l.trts)&&l.trts.length>0;
function structOf(l){
  const imp=!hasTrts(l);
  const trts=imp?[{id:"0",name:"",fa:"",fb:""}]:l.trts.map((t,i)=>({id:String(t.id??i+1),name:t.name||`処理${i+1}`,fa:t.fa||"",fb:t.fb||""}));
  const fpt=Math.max(1,Math.floor(+(imp?l.flowers:l.fpt))||1);
  const spf=Math.max(1,Math.floor(+l.spf)||SPF_DEF);
  let maxmm=Math.floor(+l.maxmm)||MAXMM_DEF;maxmm=Math.min(60,Math.max(4,maxmm-maxmm%2));
  return {trts,fpt,spf,maxmm,implicit:imp,total:trts.length*fpt*spf};
}
const structLabel=l=>{const S=structOf(l);return S.implicit?`${S.fpt}花`:`${S.trts.length}処理区×${S.fpt}花（計${S.trts.length*S.fpt}花）`};
const ukey=(tid,f,s)=>`${tid}-${f}-${s}`;
const blank=v=>v==null||v==="";
const obsOf=(l,k)=>(l.obs&&typeof l.obs==="object"&&l.obs[k])||{};
const isRec=o=>!!(o&&(o.x||!blank(o.l)||!blank(o.t)||!blank(o.e)||o.n||(o.c&&Object.keys(o.c).some(m=>!blank(o.c[m])))));
const isNumT=t=>!blank(t)&&/^\d+$/.test(String(t));
const num=v=>{v=String(v??"").trim();if(v==="")return"";const x=Math.floor(+v);return isFinite(x)&&x>=0?x:""};
const cls=k=>`${k}–${+k+2} mm`;
/* 本数を入力する線の上限（mm）。最先端より先の線は0本、雌しべの長さより先の線は存在しない */
function lineTop(o,maxmm){
  if(o.t==="none")return 0;
  let top=blank(o.l)?maxmm:+o.l;
  if(isNumT(o.t))top=Math.min(top,+o.t);
  return top;
}
const linesTo=mm=>{const a=[];for(let m=2;m<=mm;m+=2)a.push(m);return a};
function countRec(l){const S=structOf(l);let rec=0,lost=0;const keys=new Set();
  S.trts.forEach(T=>{for(let f=1;f<=S.fpt;f++)for(let s=1;s<=S.spf;s++){const k=ukey(T.id,f,s);keys.add(k);const o=obsOf(l,k);if(isRec(o)){rec++;if(o.x)lost++}}});
  const all=l.obs&&typeof l.obs==="object"?Object.keys(l.obs).filter(k=>isRec(l.obs[k])):[];
  return {rec,lost,total:S.total,orphan:all.filter(k=>!keys.has(k)).length};
}

       <div class="note info"><b>目的</b>　${isAlpha(l)?"亜硫酸を染色液に持ち込まないため。要否は検証項目（04 の3節）。":"ClearSeeを染色液に持ち込まないため（亜硫酸を含まないので、省いてもよい）。"}</div>
       <div class="note info"><b>タイマー</b>　2回分の10分。5分で知らせるので、そこで液を交換する。</div>
       ${wasteNote(`除いた${rName(l)} → 有機${isAlpha(l)?"（亜硫酸塩を含むので酸と混ぜない）":""}。K₃PO₄ → 無機・アルカリ性。`)}`},
  {n:6,k:"6",lab:"6",s:"染色",name:"アニリンブルー染色",chg:l=>!noClear(l),min:()=>180,cond:()=>["0.1％AB／0.1M K₃PO₄ 1 mL","室温・遮光","3時間"],
    body:l=>noClear(l)?
      `<p>水を除き、${chip("ab","アニリンブルー染色液")} を1 mL加える。遮光して室温で染色する。</p>`:
      `<p>${rinseOf(l)?"工程5'のK₃PO₄":rName(l)}をピペットで除き、${chip("ab","アニリンブルー染色液")} を1 mL加える。遮光して室温で染色する。</p><div class="note info"><b>メモ</b>　水系の液に移ると一時的に白っぽく見えるが、封入すると透明感は戻る。</div>${rinseOf(l)?"":wasteNote(`除いた${rName(l)} → 有機${isAlpha(l)?"（亜硫酸塩を含むので酸と混ぜない）":""}。`)}`},
  {n:7,k:"7",lab:"7",s:"封入",name:"封入・押しつぶし",chg:l=>!mountAb(l),min:()=>0,
    cond:l=>[mountAb(l)?"染色液で封入":"グリセリン封入液 1〜2滴","カバーガラス＋濾紙","スライド重ね／おもり"],
    body:l=>`<p>雌しべをスライドガラスに並べ、${mountAb(l)?chip("ab","染色液"):chip("mount","グリセリン封入液")} を1〜2滴垂らす（多すぎないこと）。カバーガラスをかけて1〜2分置き、濾紙を重ねてから押しつぶす。周囲を透明マニキュアで封じる。</p>
     <div class="note"><b>押し方</b>　指を痛めない方法で行う：① 濾紙の上にスライドガラスを重ねて手のひらで押す、または ② 100〜500 gのおもりを30秒〜1分載せる。<b>区の間で方法を統一</b>し、使った方法をロットのメモに書く。</div>
     <div class="note info"><b>押しても広がらない場合</b>　KOH処理（液温の低下）を見直す。</div>
     ${wasteNote(mountAb(l)?"染色液 → 無機・アルカリ性。":"グリセリン封入液 → 有機。スライドに付いた分は固形廃棄物。")}`},
  {n:8,k:"8",lab:"8",s:"観察",name:"蛍光観察と記録",min:()=>0,cond:()=>["UV励起","従来法と同じ露光から","冷暗所・数日以内","花柱ごとに記録"],
    body:()=>`<p>従来法と同じフィルター・露光条件で観察を始める。封入後は冷暗所に置き、数日以内に観察する。</p>
     <p>柱頭から2 mmごとの線を基準に、花柱1本ずつ記録する：雌しべの長さ、最先端の位置、柱頭直下で数えた「花柱に入った本数」、各線の位置で数えた「線を越えた本数」。基部に届いた花柱は「基部到達」を選ぶ（最上位の区分＝打ち切りとして扱う）。</p>`}
];
const LAST=8;
const nameOf=(s,l)=>typeof s.name==="function"?s.name(l):s.name;
const flag=(f,l)=>typeof f==="function"?!!f(l):!!f;
const idx=n=>STEPS.findIndex(s=>s.n===n);
const stepOf=n=>STEPS[idx(n)]||STEPS[0];
const nextOf=n=>{const i=idx(n);return i<0||i>=STEPS.length-1?LAST+1:STEPS[i+1].n};
const prevOf=n=>{if(n>LAST)return LAST;const i=idx(n);return i>0?STEPS[i-1].n:null};
const curOf=l=>{const c=+l.cur;return c>LAST?LAST+1:(idx(c)>=0?c:1)};

/* ---------- state & storage ---------- */
let lots={};           // id -> lot
let sel=null;          // selected lot id
let viewStep={};       // lotId -> step n being viewed
let obsSel={};         // lotId -> {t:処理区の番号（0始まり）, f:花の番号}
let mode="local";      // "db" | "local"
let db=null;
const LS="kafunkan-navi-lots";
const beeped=new Set();
const chains={};
const dirty={};        // id -> 未保存の変更の通し番号（保存が済むまで、共有記録からの読み込みで上書きしない）
const timers={};
function loadLocal(){try{lots=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){lots={}}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(lots))}catch(e){}}
function setSaveState(){const el=$("#saveState");el.classList.toggle("local",mode!=="db");el.querySelector("span").textContent=mode==="db"?"共有記録に自動保存":"この端末に保存"}
function cloneLot(id){const c=JSON.parse(JSON.stringify(lots[id]));if(!c.steps||typeof c.steps!=="object")c.steps={};if(!c.res||typeof c.res!=="object")c.res={};return c}
function writeLot(id){
  clearTimeout(timers[id]);delete timers[id];
  const lot=lots[id];if(!lot)return;
  if(mode!=="db"){saveLocal();delete dirty[id];return}
  const body=JSON.parse(JSON.stringify(lot));delete body.id;const stamp=dirty[id];
  chains[id]=(chains[id]||Promise.resolve()).then(()=>db.collection("lots").doc(id).set(body)).then(()=>{if(dirty[id]===stamp)delete dirty[id]}).catch(e=>{
    toast(e&&e.code==="quota_exceeded"?"保存容量の上限に達しました。古いロットを削除してください。":"保存できませんでした。通信を確認してください。")});
}
/* opt.quiet＝画面を描き直さない（入力中）、opt.wait＝少し待ってまとめて保存 */
function persist(lot,opt){
  opt=opt||{};lots[lot.id]=lot;dirty[lot.id]=(dirty[lot.id]||0)+1;
  if(!opt.quiet)render();
  if(opt.wait){clearTimeout(timers[lot.id]);timers[lot.id]=setTimeout(()=>writeLot(lot.id),700)}else writeLot(lot.id);
}
function flushAll(){Object.keys(timers).forEach(writeLot)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushAll()});
window.addEventListener("pagehide",flushAll);
function removeLot(id){
  clearTimeout(timers[id]);delete timers[id];delete dirty[id];
  delete lots[id];if(sel===id)sel=sortedIds()[0]||null;render();
  if(mode==="db")(chains[id]||Promise.resolve()).then(()=>db.collection("lots").doc(id).delete()).catch(()=>toast("削除できませんでした。"));
  else saveLocal();
}
async function initStore(){
  loadLocal();setSaveState();render();
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      const d=await window.claude.use("db");
      if(d){db=d;mode="db";setSaveState();
        let first=true;
        db.collection("lots").onSnapshot(snap=>{
          const m={};snap.docs.forEach(doc=>{if(doc.exists)m[doc.id]={...doc.data(),id:doc.id}});
          Object.keys(dirty).forEach(id=>{if(lots[id])m[id]=lots[id]});
          let same=false;try{same=!first&&JSON.stringify(m)===JSON.stringify(lots)}catch(e){}
          lots=m;if(first){first=false;if(!sel||!lots[sel])sel=sortedIds()[0]||null}
          if(!same)render();
        },()=>{mode="local";setSaveState();loadLocal();render();toast("共有記録に接続できないため、この端末に保存します。")});
        return;
      }
    }
  }catch(e){}
  mode="local";setSaveState();if(!sel)sel=sortedIds()[0]||null;render();
}
function sortedIds(){return Object.keys(lots).sort((a,b)=>(lots[a].created||0)-(lots[b].created||0))}

/* ---------- lot logic ---------- */
function newLot(o){
  const id="l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const l={id,created:Date.now(),name:o.name,zone:o.zone,days:+o.days||1,reagent:o.reagent||"alpha",koh:+o.koh||10,
    flowers:+o.flowers||5,cultivar:o.cultivar||"",hap:o.hap||"",memo:o.memo||"",cur:1,steps:{},res:{}};
  if(o.spf)l.spf=+o.spf;
  ["soft","clr","mount"].forEach(k=>{if(o[k])l[k]=o[k]});
  if(o.rinse!=null)l.rinse=+o.rinse?1:0;
  return l;
}
function stepState(l,n){const st=(l.steps||{})[stepOf(n).k]||{};return {s:st.s||null,e:st.e||null,skip:!!st.skip}}
function activeTimer(l){const n=curOf(l);if(n>LAST)return null;const st=stepState(l,n);const m=stepOf(n).min(l);if(st.s&&m>0)return {n,until:st.s+m*60000,s:st.s,m};return null}
function lotStatus(l){
  const c=curOf(l);
  if(c>LAST)return {t:"完了",c:""};
  const a=activeTimer(l);
  if(a){const left=a.until-Date.now();return left>0?{t:stepOf(a.n).s+" 残り",c:dur(left),until:a.until}:{t:stepOf(a.n).s+" 時間到達",c:"完了待ち"}}
  return {t:"工程"+stepOf(c).lab+" "+stepOf(c).s,c:"待機"};
}
function startStep(id,n){const l=cloneLot(id);const k=stepOf(n).k;l.steps[k]={...(l.steps[k]||{}),s:Date.now()};persist(l)}
function completeStep(id,n,skip){
  const l=cloneLot(id);const now=Date.now();const s=stepOf(n);const prev=l.steps[s.k]||{};
  l.steps[s.k]=skip?{e:now,skip:true}:{s:prev.s||now,e:now};
  l.cur=Math.max(curOf(l),nextOf(n));viewStep[id]=Math.min(l.cur,LAST);persist(l);
  toast(`工程${s.lab}を${skip?"省略として":""}記録しました（${fmt(now)}）`);
}
/* 工程 n を「未完了」に戻す：開始ボタンで計り始めた開始時刻だけ残す（keepStart=false なら消す） */
function reopen(l,n,keepStart){
  const s=stepOf(n),st=l.steps[s.k];if(!st)return;
  if(keepStart&&st.s&&!st.skip&&st.s!==st.e&&s.min(l)>0)l.steps[s.k]={s:st.s};else delete l.steps[s.k];
}
const clearAfter=(l,n)=>STEPS.forEach(x=>{if(x.n>n)delete l.steps[x.k]});
const strayAfter=(l,n)=>STEPS.filter(x=>x.n>n&&(l.steps||{})[x.k]).length;
function undoStep(id){
  const l=cloneLot(id);const n=prevOf(curOf(l));if(!n)return;
  reopen(l,n,true);clearAfter(l,n);
  l.cur=n;viewStep[id]=n;persist(l);toast(`工程${stepOf(n).lab}の完了を取り消しました`);
}
function moveTo(id,n,clr,clrCur){
  const l=cloneLot(id);
  if(n<=LAST){reopen(l,n,!clrCur);if(clr)clearAfter(l,n)}
  l.cur=n;viewStep[id]=Math.min(n,LAST);persist(l);
  toast(n>LAST?"全工程を完了の状態にしました":`現在の工程を${stepOf(n).lab}にしました`);
}

/* ---------- render: run view ---------- */
function render(){renderRun();if(!$("#v-rec").hidden)renderRec()}
function renderRun(){
  const v=$("#v-run");const ids=sortedIds();
  let keep=null;const ae=document.activeElement;
  if(ae&&ae.id&&v.contains(ae)){keep={id:ae.id};try{keep.s=ae.selectionStart;keep.e=ae.selectionEnd}catch(e){}}
  if(sel&&!lots[sel])sel=ids[0]||null;
  if(!ids.length){v.innerHTML=emptyHTML();bindRun();return}
  const strip=ids.map(id=>{const l=lots[id];const st=lotStatus(l);const c=curOf(l);
    const dots=STEPS.map(s=>`<span class="${c>s.n?"d":c===s.n?"c":""}"></span>`).join("");
    return `<button class="lot" data-lot="${id}" aria-current="${id===sel}"><span class="nm">${esc(l.name)}</span>
      <span>${zonePill(l)}</span><span class="dots">${dots}</span>
      <span class="st"><span>${esc(st.t)}</span><span class="mono" ${st.until?`data-until="${st.until}"`:""}>${esc(st.c)}</span></span></button>`}).join("");
  v.innerHTML=`<div class="lots" role="list">${strip}<button class="lot new" data-act="new">＋ ロット追加</button><button class="lot new" data-act="pilot">＋ 予備試験セット</button></div>${sel?stepHTML(lots[sel]):""}`;
  bindRun();
  if(keep){const el=document.getElementById(keep.id);if(el&&v.contains(el)){try{el.focus({preventScroll:true});if(keep.s!=null&&el.setSelectionRange)el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
}
/* 区の記号＋方法の名前。方法は軟化液・透明化・すすぎ・封入液の組合せから決める */
function zonePill(l){
  const z={A:"A",N:"N",B:"B",C:"C",M:"本試験"}[l.zone]??esc(l.zone||"");
  const m=methOf(l),k=presetKey(m);
  const c=m.clr==="alpha"?"alpha":m.clr==="cs"?"cs":k==="conv"?"A":"N";
  const nm=m.clr==="none"?(k?PRESETS[k].name:"透明化なし・組合せ"):`${rName(l)} ${l.days||1}日${k?"":"・組合せ"}`;
  return `<span class="pill ${c}">${z} ${nm}</span>`;
}
function emptyHTML(){
  return `<div class="empty"><h3>まだロットがありません</h3>
  <p>ロットは同じ条件で一緒に処理する試料のまとまりです。方法（従来法・透明化なし・ClearSee・ClearSeeAlpha、または自由な組合せ）はロットごとに選べ、途中でも「方法を変更」で変えられます。ロットの中に処理区と花を持てます（例：12処理区×3花）。工程を1つずつ進めると各工程の時刻が自動で記録され、工程8では花柱ごとに観察結果を入力します。「記録」タブからExcelと解析用CSVを書き出せます。</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="new">ロットを1つ作成</button><button class="btn" data-act="pilot">予備試験セットを作成</button></div></div>`;
}
function stepHTML(l){
  const id=l.id;const c=curOf(l);
  let n=viewStep[id];if(idx(n)<0)n=Math.min(c,LAST);viewStep[id]=n;
  const s=stepOf(n),st=stepState(l,n),m=s.min(l);
  const rail=STEPS.map(x=>`<button data-go="${x.n}" class="${c>x.n?"done":c===x.n?"cur":""} ${x.n===n?"view":""}" aria-label="工程${x.lab} ${esc(nameOf(x,l))}"><b>${x.lab}</b><small>${x.s}</small></button>`).join("");
  const cond=s.cond(l).map(t=>`<span>${t}</span>`).join("")+(flag(s.chg,l)?`<span class="chg">従来法から変更</span>`:"");
  let timeBlock="",acts="";
  const isCur=c===n,isDone=c>n;
  if(isDone){
    if(st.skip)timeBlock=`<div class="stamp">省略　<span class="mono">${fmt(st.e)}</span></div>`;
    else if(st.e)timeBlock=`<div class="stamp">${st.s?`開始 <span class="mono">${fmt(st.s)}</span>　`:""}完了 <span class="mono">${fmt(st.e)}</span>${st.s&&st.e?`　所要 <span class="mono">${dur(st.e-st.s)}</span>`:""}</div>`;
    else if(st.s)timeBlock=`<div class="stamp">開始 <span class="mono">${fmt(st.s)}</span>　完了時刻の記録なし</div>`;
    else timeBlock=`<div class="note info"><b>記録なし</b>　${s.k==="5p"?"工程5'を追加する前（Ver. 2.0）に進めたか、工程を移動したロットのため、記録はありません。":"この工程の時刻は記録されていません。"}</div>`;
  }else if(isCur&&m>0){
    const mid=s.mid?s.mid(l):0;
    if(st.s){const until=st.s+m*60000;
      timeBlock=`<div class="timer" data-timer="${until}" data-start="${st.s}"><div><div class="big mono" data-until="${until}">${dur(until-Date.now())}</div><div class="meta">開始 ${fmt(st.s)}　｜　予定 ${fmt(until)}${n===1?"（最短）":""}${mid?`　｜　${mid}分で液を交換`:""}</div></div><div class="bar"><i></i></div></div>`;
    }else timeBlock=`<div class="timer"><div><div class="big mono">${dur(m*60000)}</div><div class="meta">「開始」を押すとタイマーが動き、開始時刻を記録します${mid?`（${mid}分で一度知らせます）`:""}</div></div></div>`;
  }else if(!isCur&&!isDone){timeBlock=`<div class="note info"><b>未到達</b>　現在は工程${stepOf(c>LAST?LAST:c).lab}です。内容の確認だけできます。${n===LAST?"観察の入力は、工程7を完了するか「工程を移動」で工程8に進めると使えます。":""}</div>`}
  const stray=c<=LAST?strayAfter(l,c):0;
  if(stray)timeBlock+=`<div class="note"><b>要整理</b>　現在の工程（${stepOf(c).lab}）より後の${stray}工程に時刻の記録が残っています。「工程を移動」で、実際に進んだ工程に合わせるか、後の記録を消してください。</div>`;
  if(n===LAST&&(isCur||isDone))timeBlock+=obsPanel(l);
  // actions
  const canSkip=s.skip&&flag(s.skip,l);
  if(isCur){
    if(n===LAST)acts+=`<button class="btn pri" data-act="finish">観察を完了として記録</button>`;
    else if(canSkip&&m===0){acts+=`<button class="btn pri" data-act="skip">行わない → 次へ</button><button class="btn" data-act="meth">方法を変更</button>`}
    else{
      if(m>0&&!st.s)acts+=`<button class="btn glow" data-act="start">開始</button>`;
      acts+=`<button class="btn ${m>0&&!st.s?"":"pri"}" data-act="done">完了して次へ</button>`;
      if(canSkip&&!st.s)acts+=`<button class="btn" data-act="skip">省略して次へ</button>`;
    }
  }
  const pv=prevOf(n),nx=n>=LAST?null:nextOf(n);
  const nav=`<span class="sp"></span>${c>1?`<button class="btn ghost" data-act="undo">直前の完了を取り消す</button>`:""}<button class="btn ghost" data-act="move">工程を移動</button>
    <button class="btn" ${pv?`data-go="${pv}"`:"disabled"}>← 前</button><button class="btn" ${nx?`data-go="${nx}"`:"disabled"}>次 →</button>`;
  const head=`<div class="lothead"><div class="t"><b>${esc(l.name)}</b>${zonePill(l)}
    <div class="stamp">${esc(l.cultivar||"品種未入力")}　｜　${esc(structLabel(l))}　｜　受粉後 ${esc(l.hap||"—")}${l.memo?"　｜　"+esc(l.memo):""}</div>
    <div class="stamp">方法：${esc(methSummary(l))}</div></div>
    <button class="btn pri" data-act="meth">方法を変更</button><button class="btn" data-act="struct">処理区・花</button><button class="btn" data-act="edit">ロット設定</button></div>`;
  return `${head}<div class="rail">${rail}</div>
  <article class="card"><div class="card-h"><div class="num">${s.lab}</div><div class="t"><h3>${esc(nameOf(s,l))}</h3><div class="cond">${cond}</div></div></div>
  <div class="card-b">${s.body(l)}${timeBlock}</div>
  <div class="actions">${acts}${nav}</div></article>`;
}

/* ---------- 工程8：花柱ごとの記録 ---------- */
const opt=(v,t,cur)=>`<option value="${esc(v)}" ${String(cur??"")===String(v)?"selected":""}>${esc(t)}</option>`;
function obsPanel(l){
  const S=structOf(l);const C=countRec(l);const r=l.res||{};
  const p=obsSel[l.id]||(obsSel[l.id]={t:0,f:1});
  if(!(p.t>=0&&p.t<S.trts.length))p.t=0;if(!(p.f>=1&&p.f<=S.fpt))p.f=1;
  const T=S.trts[p.t];
  const nf=(tid,f)=>{let n=0;for(let s=1;s<=S.spf;s++)if(isRec(obsOf(l,ukey(tid,f,s))))n++;return n};
  const nt=tid=>{let n=0;for(let f=1;f<=S.fpt;f++)n+=nf(tid,f);return n};
  const tp=S.implicit?"":`<div><div class="pick-l">処理区</div><div class="pick">${S.trts.map((t,i)=>{const n=nt(t.id),a=S.fpt*S.spf;
      return `<button data-ot="${i}" aria-pressed="${i===p.t}" class="${n>=a?"full":""}"><span>${i+1}. ${esc(t.name)}</span><small>${n}/${a}</small></button>`}).join("")}</div></div>`;
  let fl="";for(let f=1;f<=S.fpt;f++){const n=nf(T.id,f);fl+=`<button data-ofl="${f}" aria-pressed="${f===p.f}" class="${n>=S.spf?"full":""}"><span>花${f}</span><small>${n}/${S.spf}</small></button>`}
  let rows="";for(let s=1;s<=S.spf;s++)rows+=styleRow(l,S,T,p.f,s);

function styleRow(l,S,T,f,s){

function setObs(id,key,fn,o2){
  const l=cloneLot(id);if(!l.obs||typeof l.obs!=="object"||Array.isArray(l.obs))l.obs={};
  const o=JSON.parse(JSON.stringify(l.obs[key]||{}));fn(o);
  if(!o.x){delete o.x;
    if(isNumT(o.t)&&!blank(o.l)&&+o.t>+o.l){delete o.t;toast("最先端が雌しべの長さを超えるため、最先端を未入力に戻しました")}
    const top=lineTop(o,structOf(l).maxmm);
    if(o.c){Object.keys(o.c).forEach(m=>{if(+m>top||blank(o.c[m]))delete o.c[m]});if(!Object.keys(o.c).length)delete o.c}
    if(o.t==="none"&&blank(o.e))o.e=0;
  }
  ["l","t","e","n"].forEach(k=>{if(blank(o[k]))delete o[k]});

function setRes(id,k,v,o2){const l=cloneLot(id);if(blank(v))delete l.res[k];else l.res[k]=v;persist(l,o2)}
function onObsInput(e){

}
function onObsChange(e){

function act(a){

  if(a==="edit")return openLotForm(sel);

  Object.values(lots).forEach(l=>{const a=activeTimer(l);if(!a)return;const s=stepOf(a.n);

function renderRec(){
  const ids=sortedIds();const v=$("#v-rec");
  if(!ids.length){v.innerHTML=`<div class="empty"><h3>記録はまだありません</h3><p>「工程」タブでロットを作成し、工程を完了すると、ここに時刻と観察結果が自動で並びます。</p></div>`;return}
  const rows=ids.map(id=>rowOf(lots[id]));
  const nSty=ids.reduce((a,id)=>a+countRec(lots[id]).rec,0);
  v.innerHTML=`<div class="rec-bar"><h2 style="margin:0;margin-right:auto">記録（${ids.length}ロット）</h2>
    <button class="btn pri" id="xl">Excelで書き出す</button><button class="btn" id="cp">表をコピー</button></div>
    <div class="tbl-wrap"><table><thead><tr>${COLS.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(r=>`<tr>${COLS.map(c=>`<td class="${c[1].startsWith("e")?"mono":""}">${esc(r[c[1]]??"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="lede" style="margin-top:10px">${mode==="db"?"記録はこのページの共有記録に自動保存され、ページを開いた人の間で共有されます。":"記録はこの端末のブラウザに保存されています（ほかの端末とは共有されません）。定期的にExcelで書き出してください。"}「区」は記号（ラベル）で、実際の方法は「方法」「軟化液」「透明化液」「すすぎ」「封入液」の列に出ます（今の設定）。Excelには、ロットの表と、花柱ごとの表（シート「花柱」）が入ります。</p>
    <div class="rec-bar" style="margin-top:22px"><h2 style="margin:0;margin-right:auto">花柱ごとの記録（${nSty}本）</h2><button class="btn pri" id="csv">解析用CSVを書き出す</button></div>
    <p class="lede">花柱1本＝1行の縦長の表です。ファイル名は「品種_特性_年.csv」。Rでは <span class="mono">read.csv(…, fileEncoding="UTF-8-BOM")</span> で読めます（空欄はNA）。</p>`;
  $("#xl").onclick=()=>exportXlsx(rows);
  $("#csv").onclick=()=>openCsv();
  $("#cp").onclick=()=>{const tsv=[COLS.map(c=>c[0]).join("\t"),...rows.map(r=>COLS.map(c=>String(r[c[1]]??"").replace(/\s+/g," ")).join("\t"))].join("\n");
    const ok=()=>toast("表をコピーしました。Excelに貼り付けできます。");
    try{navigator.clipboard.writeText(tsv).then(ok,()=>showTsv(tsv))}catch(e){showTsv(tsv)}};
}
function showTsv(tsv,ttl){openModal(`<div class="sheet-h"><h3>${ttl||"表のテキスト"}<small>全選択してコピーし、Excelやテキストエディタに貼り付けてください</small></h3><button class="btn ghost" data-close>閉じる</button></div><div class="fld"><textarea id="tsv" style="min-height:240px;font-family:var(--f-mono);font-size:12px">${esc(tsv)}</textarea></div>`,m=>{const t=m.querySelector("#tsv");t.focus();t.select()})}
/* ファイル保存：公開ページでは downloads、それ以外（GitHub Pagesなど）は通常のダウンロード。保存できたら true */
async function saveFile(name,data,mime){
  if(window.claude&&typeof window.claude.use==="function"){
    const dl=await window.claude.use("downloads");
    if(!dl){toast("この画面では書き出せません。");return false}
    try{await dl.save({filename:name,data});return true}catch(e){if(!e||e.code!=="declined")toast("書き出せませんでした。");return false}
  }
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return true}
  catch(e){toast("書き出せませんでした。");return false}
}
async function exportXlsx(rows){
  if(!window.XLSX){toast("Excel書き出しの部品を読み込めませんでした。「表をコピー」を使ってください。");return}
  const aoa=[COLS.map(c=>c[0]),...rows.map(r=>COLS.map(c=>{const x=r[c[1]];return x!==""&&x!=null&&!isNaN(x)&&NUMCOLS.includes(c[1])?+x:(x??"")}))];
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws["!cols"]=COLS.map(c=>({wch:c[1].startsWith("e")?17:c[1]==="note"?30:12}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"花粉管観察");
  const t=styleTable(sortedIds(),false);
  const ws2=XLSX.utils.aoa_to_sheet([t.head,...t.rows]);ws2["!cols"]=t.head.map(h=>({wch:/_id$|^lot$|recorded_at|note/.test(h)?22:11}));
  XLSX.utils.book_append_sheet(wb,ws2,"花柱");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  await saveFile(`花粉管観察記録_${today()}.xlsx`,buf,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}
function openCsv(){
  const ids=sortedIds();const withRec=ids.filter(id=>countRec(lots[id]).rec>0);
  const pre=withRec.length?withRec:(sel&&lots[sel]?[sel]:ids.slice(0,1));
  const cv0=fileSafe((lots[pre[0]]||{}).cultivar)||"品種";
  openModal(`<div class="sheet-h"><h3>解析用CSVを書き出す<small>花柱1本＝1行（縦長）</small></h3><button class="btn ghost" data-close>閉じる</button></div>
   <div class="pick-l">書き出すロット</div>
   <div>${ids.map(id=>{const l=lots[id],C=countRec(l);return `<label class="mv"><input type="checkbox" data-lotck="${id}" ${pre.includes(id)?"checked":""}><span>${esc(l.name)}</span><span class="stamp mono">${C.rec}/${C.total}本</span></label>`}).join("")}</div>
   <div class="form" style="margin-top:12px">
    <div class="fld"><label for="c-cv">品種</label><input id="c-cv" value="${esc(cv0)}"></div>
    <div class="fld"><label for="c-tr">特性</label><input id="c-tr" value="花粉管伸長"></div>
    <div class="fld"><label for="c-yr">年（採取・試験の年）</label><input id="c-yr" type="number" inputmode="numeric" value="${new Date().getFullYear()}"></div>
   </div>
   <label class="ck"><input type="checkbox" id="c-blank"><span>未記録の花柱も行として含める（status＝blank）</span></label>
   <p class="stamp" style="margin-top:10px">ファイル名：<span class="mono" id="c-name"></span>　｜　<span id="c-n"></span></p>
   <div class="note info"><b>列の決まり</b>　方法の列：clearing（none／ClearSee／ClearSeeAlpha）、softening（KOH／KOH_sulfite）、rinse（工程5'、0／1）、mount（stain／glycerol）。tip_class＝最先端の区分（none、00-02、02-04、…、base、unknown）。base は基部到達＝打ち切り（base_reached＝1）。pistil_len_mm・tip_mm は区分の下限（14 は 14–16 mm）。n_02mm などは各線を越えた本数で、最先端より先の線は0、雌しべの長さより先の線と数えていない線は空欄（NA）。欠測の花柱は status＝lost で、測定値は空欄。flower_id は花ごとの番号（変量効果用）。</div>
   <div class="mbtns"><button class="btn pri" id="c-ok">CSVを書き出す</button><button class="btn" id="c-txt">テキストで表示</button><button class="btn" data-close>やめる</button></div>`,m=>{
    const picked=()=>[...m.querySelectorAll("[data-lotck]")].filter(c=>c.checked).map(c=>c.dataset.lotck);
    const name=()=>`${fileSafe(m.querySelector("#c-cv").value)||"品種"}_${fileSafe(m.querySelector("#c-tr").value)||"特性"}_${fileSafe(m.querySelector("#c-yr").value)||new Date().getFullYear()}.csv`;
    const table=()=>styleTable(picked(),m.querySelector("#c-blank").checked);
    const upd=()=>{m.querySelector("#c-name").textContent=name();m.querySelector("#c-n").textContent=`${table().rows.length}行`};
    m.querySelectorAll("input").forEach(i=>i.addEventListener("input",upd));upd();
    m.querySelector("#c-ok").onclick=async()=>{const t=table();if(!t.rows.length){toast("書き出す行がありません。ロットを選ぶか、工程8で記録を入力してください。");return}
      const ok=await saveFile(name(),toCsv(t),"text/csv;charset=utf-8");if(ok){closeModal();toast(`${name()} を書き出しました（${t.rows.length}行）`)}};
    m.querySelector("#c-txt").onclick=()=>{const t=table();showTsv(toCsv(t).slice(1),name())};
  });
}

/* ---------- views ---------- */
function showView(v){["run","reag","rec"].forEach(x=>{$("#v-"+x).hidden=x!==v;$("#tab-"+x).setAttribute("aria-selected",x===v)});
  if(v==="reag")renderReag();if(v==="rec")renderRec();if(v==="run")renderRun();window.scrollTo(0,0)}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showView(b.dataset.v));
initStore();
})();
</script>
